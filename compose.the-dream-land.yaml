services:
  playwright-service:
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 2g

  api:
    restart: unless-stopped
    ports: !reset []
    cpus: 1.5
    mem_limit: 3g
    memswap_limit: 3g
    environment:
      NUM_WORKERS_PER_QUEUE: "1"
      NUQ_WORKER_COUNT: "1"
      CRAWL_CONCURRENT_REQUESTS: "1"
      MAX_CONCURRENT_JOBS: "1"
      BROWSER_POOL_SIZE: "1"
      MAX_CPU: "0.70"
      MAX_RAM: "0.75"
      SEARXNG_ENDPOINT: http://searxng:8080
    networks:
      - backend
      - open-webui
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nuq-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/v0/health/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  redis:
    image: redis:alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 256m
    memswap_limit: 256m
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  nuq-postgres:
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 768m
    memswap_limit: 768m
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  foundationdb:
    profiles: ["foundationdb"]

  foundationdb-init:
    profiles: ["foundationdb"]

  gateway:
    image: nginxinc/nginx-unprivileged:1.29.1-alpine@sha256:27985295bdb22a1ef8f712863210bd5877c0f3006494a593e86b3fe0fa55467e
    restart: unless-stopped
    env_file:
      - ${FIRECRAWL_API_ENV_FILE:-./secrets/api.env}
    environment:
      NGINX_ENVSUBST_FILTER: ^FIRECRAWL_API_KEY$
    ports:
      - "127.0.0.1:3002:8080"
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro,Z
    networks:
      backend: {}
      open-webui:
        aliases: ["firecrawl-gateway"]
    depends_on:
      api:
        condition: service_healthy
    cpus: 0.1
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1777
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -qx ok"]
      interval: 15s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  open-webui:
    name: open-webui-network
    external: true

volumes:
  postgres-data:
    name: firecrawl-postgres-data
  redis-data:
    name: firecrawl-redis-data
  rabbitmq-data:
    name: firecrawl-rabbitmq-data
